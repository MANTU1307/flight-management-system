# Activated on Railway via SPRING_PROFILES_ACTIVE=prod
# Railway auto-injects MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER,
# MYSQLPASSWORD when you reference its MySQL plugin's variables in your
# service's Variables tab (Railway's UI lets you pick them from a dropdown
# so you don't have to type the values yourself).
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
razorpay.key.id=${RAZORPAY_KEY}
razorpay.key.secret=${RAZORPAY_SECRET}
# Set this to your deployed Vercel URL once you have it, e.g.
# https://skybound.vercel.app ? comma-separate multiple origins if needed.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}